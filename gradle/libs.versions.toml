[versions]
kotlin                        = "1.9.24"
kotlinxSerialization          = "1.7.3"
kotlinxCoroutines             = "1.8.1"
intellijPlatformGradlePlugin  = "2.19.0"
intellijPlatform              = "2026.1"
sinceBuild                    = "261"
junit                         = "5.10.2"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "kotlinxCoroutines" }
junit-jupiter              = { module = "org.junit.jupiter:junit-jupiter",                  version.ref = "junit" }
junit-platform-launcher    = { module = "org.junit.platform:junit-platform-launcher",       version = "1.10.2" }

[plugins]
kotlin-jvm         = { id = "org.jetbrains.kotlin.jvm",                        version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization",     version.ref = "kotlin" }
intellij-platform  = { id = "org.jetbrains.intellij.platform",                 version.ref = "intellijPlatformGradlePlugin" }
